version: 2

models:
  - name: dim_zone
    columns:
      - name: zone_id
        data_tests: [unique, not_null]

  - name: dim_payment_type
    columns:
      - name: payment_type_id
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_id
        data_tests: [unique, not_null]

  - name: fct_trips
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: pickup_date_id
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: pickup_zone_id
        data_tests:
          - relationships:
              to: ref('dim_zone')
              field: zone_id
      - name: dropoff_zone_id
        data_tests:
          - relationships:
              to: ref('dim_zone')
              field: zone_id
      - name: payment_type_id
        data_tests:
          - relationships:
              to: ref('dim_payment_type')
              field: payment_type_id